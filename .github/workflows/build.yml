name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/heyun007/mind
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > app/src/main/java/com/heyun007/mind/MainActivity.java << 'EOF'
                    package com.heyun007.mind;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_CODE = 1001;
              private static final int SAVE_FILE_CODE = 1002;

              private String pendingSaveContent = null;
              private String pendingSaveFileName = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setupWebView();

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 2001);
                  }
              }

              private void setupWebView() {
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          try {
                              if (view != null && view.getParent() != null) {
                                  ((android.view.ViewGroup) view.getParent()).removeView(view);
                              }
                              if (view != null) view.destroy();
                          } catch (Exception ignored) {}
                          setupWebView();
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void saveFile(String fileName, String base64Content) {
                          pendingSaveFileName = fileName;
                          pendingSaveContent = base64Content;
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                                      intent.setType("application/json");
                                      intent.putExtra(Intent.EXTRA_TITLE, pendingSaveFileName);
                                      startActivityForResult(intent, SAVE_FILE_CODE);
                                  } catch (Exception e) {
                                      showJsToast("保存失败：" + e.getMessage());
                                  }
                              }
                          });
                      }

                      @JavascriptInterface
                      public boolean isAndroidApp() {
                          return true;
                      }
                  }, "AndroidBridge");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;

                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);

                          try {
                              startActivityForResult(Intent.createChooser(intent, "选择文件"), FILE_CHOOSER_CODE);
                          } catch (Exception e) {
                              try {
                                  Intent i2 = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                                  i2.addCategory(Intent.CATEGORY_OPENABLE);
                                  i2.setType("*/*");
                                  startActivityForResult(i2, FILE_CHOOSER_CODE);
                              } catch (Exception e2) {
                                  filePathCallback = null;
                                  return false;
                              }
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      String[] resources = request.getResources();
                                      List<String> allowed = new ArrayList<>();
                                      for (String r : resources) {
                                          if (PermissionRequest.RESOURCE_PROTECTED_MEDIA_ID.equals(r)) {
                                              allowed.add(r);
                                          }
                                      }
                                      if (allowed.isEmpty()) {
                                          request.deny();
                                      } else {
                                          request.grant(allowed.toArray(new String[0]));
                                      }
                                  } catch (Exception e) {
                                      try { request.deny(); } catch (Exception ignored) {}
                                  }
                              }
                          });
                      }
                  });

                  webView.loadUrl("https://heyun007.github.io/Mind/");
              }

              private void showJsToast(final String msg) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String escaped = msg.replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                              webView.evaluateJavascript(
                                  "try{ if(typeof showToast==='function') showToast('" + escaped + "'); }catch(e){}",
                                  null
                              );
                          } catch (Exception ignored) {}
                      }
                  });
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          } else if (data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  } else if (requestCode == SAVE_FILE_CODE) {
                      if (resultCode == Activity.RESULT_OK && data != null && data.getData() != null && pendingSaveContent != null) {
                          try {
                              Uri uri = data.getData();
                              OutputStream os = getContentResolver().openOutputStream(uri);
                              byte[] bytes = Base64.decode(pendingSaveContent, Base64.DEFAULT);
                              os.write(bytes);
                              os.close();
                              showJsToast("备份保存成功！");
                          } catch (Exception e) {
                              showJsToast("保存失败：" + e.getMessage());
                          }
                      } else {
                          showJsToast("已取消保存");
                      }
                      pendingSaveContent = null;
                      pendingSaveFileName = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="Mind"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Mind</string></resources>
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2'
          }
          android {
              namespace 'com.heyun007.mind'
              compileSdk 34
              defaultConfig {
                  applicationId "com.heyun007.mind"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mind"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Download icon
        run: |
          curl -L -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png https://heyun007.github.io/Mind/icon.png || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Mind-APK
          path: app/build/outputs/apk/debug/app-debug.apk
